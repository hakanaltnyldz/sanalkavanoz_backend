services:
  - type: web
    name: sanal-kavanoz-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run prisma:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60d
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: NODE_ENV
        value: production

